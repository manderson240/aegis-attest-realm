[project]
name = "aegis-attest"
version = "0.1.0"
description = "A Gno realm that pins SHA-256 evidence of AI agent work to an agent and task, with a score and author-only revoke. Python CLI for digests and live reads through gnomcp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
aegis-attest = "aegis_attest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_attest"]

[dependency-groups]
dev = ["pytest>=8.0"]
